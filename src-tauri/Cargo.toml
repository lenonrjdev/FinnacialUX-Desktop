[package]
name = "finnacialux-desktop"
version = "0.1.0"
description = "FinnacialUX Desktop — gestão financeira offline"
authors = ["Ateliux"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "finnacialux_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
