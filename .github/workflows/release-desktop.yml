name: Release FinnacialUX Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Instalar dependências nativas
        shell: powershell
        run: choco install strawberryperl nasm -y --no-progress
      - name: Instalar dependências JavaScript
        run: npm ci
      - name: Auditar dependências altas e críticas
        run: npm audit --audit-level=high
      - name: Resolver versão e canal da release
        shell: powershell
        run: |
          $version = (Get-Content .\package.json -Raw | ConvertFrom-Json).version
          $isPrerelease = $version -match "-rc\.\d+$"
          $isStable = -not $isPrerelease
          $prerelease = $isPrerelease.ToString().ToLowerInvariant()
          $stable = $isStable.ToString().ToLowerInvariant()
          $makeLatest = "false"
          $draft = "true"
          "FINNACIALUX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FINNACIALUX_NOTES=releases/$version/RELEASE_NOTES.md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FINNACIALUX_PRERELEASE=$prerelease" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FINNACIALUX_STABLE=$stable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FINNACIALUX_MAKE_LATEST=$makeLatest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FINNACIALUX_DRAFT=$draft" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Preparar manifestos da Release Candidate
        if: env.FINNACIALUX_PRERELEASE == 'true'
        shell: powershell
        run: node scripts/release-candidate.mjs prepare .
      - name: Baixar evidências da versão homologada anterior
        if: env.FINNACIALUX_STABLE == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $config = Get-Content .\release\stable-release.json -Raw | ConvertFrom-Json
          $previous = [string]$config.promotedFrom
          $report = if ($previous -match "-rc\.\d+$") { "RC_VALIDATION_REPORT.json" } else { "STABLE_VALIDATION_REPORT.json" }
          $directory = "releases\$previous"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          gh release download "desktop-v$previous" --repo $env:GITHUB_REPOSITORY --dir $directory --pattern $report --pattern release-manifest.json
          "FINNACIALUX_PROMOTION_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Preparar manifestos da release estável
        if: env.FINNACIALUX_STABLE == 'true'
        shell: powershell
        run: |
          node scripts/stable-release.mjs verify-source .
          node scripts/stable-release.mjs prepare . $env:FINNACIALUX_PROMOTION_DIR
      - name: Gerar release assinada
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .\scripts\05_GERAR_RELEASE.ps1 -Ci
      - name: Validar artefatos da Release Candidate
        if: env.FINNACIALUX_PRERELEASE == 'true'
        shell: powershell
        run: node scripts/release-candidate.mjs verify-artifacts . "releases\$env:FINNACIALUX_VERSION"
      - name: Validar artefatos da release estável
        if: env.FINNACIALUX_STABLE == 'true'
        shell: powershell
        run: node scripts/stable-release.mjs verify-artifacts . "releases\$env:FINNACIALUX_VERSION"
      - name: Publicar rascunho para homologação
        uses: softprops/action-gh-release@v3
        with:
          files: releases/${{ env.FINNACIALUX_VERSION }}/*
          body_path: ${{ env.FINNACIALUX_NOTES }}
          draft: ${{ env.FINNACIALUX_DRAFT }}
          prerelease: ${{ env.FINNACIALUX_PRERELEASE }}
          make_latest: ${{ env.FINNACIALUX_MAKE_LATEST }}
          fail_on_unmatched_files: true
